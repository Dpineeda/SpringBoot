<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Empleado</title>
</head>
<body>
    <h1 th:text="${empleado.idEmpleado > 0 ? 'Editar empleado' : 'Nuevo empleado'}"></h1>

    <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
        <input type="hidden" th:field="*{idEmpleado}">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}"><br>

        <label>Apellidos:</label>
        <input type="text" th:field="*{apellidos}"><br>

        <label>Fecha de contratación:</label>
        <input type="date" th:field="*{fechaContratacion}"><br>

        <label>ID Puesto:</label>
        <input type="number" th:field="*{idPuesto}"><br>

        <button type="submit">Guardar</button>
        <a th:href="@{/empleados}">Cancelar</a>
    </form>
</body>
</html>
