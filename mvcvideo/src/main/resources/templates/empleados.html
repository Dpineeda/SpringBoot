<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="h3 mb-3">Registro de empleados</h1>

        <p th:if="${success}" class="alert alert-success py-2 mb-3" th:text="${success}"></p>
        <p th:if="${error}" class="alert alert-danger py-2 mb-3" th:text="${error}"></p>

        <a th:href="@{/empleados/nuevo}" class="btn btn-success btn-sm mb-3 border border-success-subtle">Nuevo empleado</a>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle mb-0 border border-secondary-subtle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Fecha Contratación</th>
                        <th>ID Puesto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${empleados}">
                        <td th:text="${e.idEmpleado}"></td>
                        <td th:text="${e.nombre}"></td>
                        <td th:text="${e.apellidos}"></td>
                        <td th:text="${e.fechaContratacion}"></td>
                        <td th:text="${e.idPuesto}"></td>
                        <td>
                            <a th:href="@{/empleados/editar/{id}(id=${e.idEmpleado})}" class="btn btn-outline-primary btn-sm me-2 border border-primary-subtle">Editar</a>
                            <form th:action="@{/empleados/eliminar/{id}(id=${e.idEmpleado})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-outline-danger btn-sm border border-danger-subtle">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
